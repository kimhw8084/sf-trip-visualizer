name: Qualify Fabric candidate

on:
  push:
    branches:
      - "codex/**"

permissions:
  contents: read

concurrency:
  group: candidate-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Exact-revision qualification
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact triggering revision
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: true

      - name: Set up the qualification runtime
        # actions/setup-python v5.6.0
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install the repository QA dependencies and browsers
        run: |
          python3 -m pip install --require-hashes -r requirements-qa.txt
          python3 -m playwright install --with-deps chromium firefox webkit

      - name: Assert the checkout matches the triggering SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Run exact-revision full qualification under the shared hosted Linux contract
        run: |
          mkdir -p QA/release
          set -o pipefail
          python3 scripts/hosted_linux_pipeline.py qualify --revision "$GITHUB_SHA" 2>&1 | tee QA/release/qualification.log

      - name: Run repository unit and contract checks
        if: always()
        run: |
          mkdir -p QA/release
          set -o pipefail
          python3 -m unittest discover -s tests -p 'test_*.py' 2>&1 | tee QA/release/unit-tests.log

      - name: Check out a clean exact revision for the Pages release-path exercise
        if: success()
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: release-path-checkout
          fetch-depth: 0
          lfs: true

      - name: Exercise the exact Pages release path without deployment
        if: success()
        working-directory: release-path-checkout
        run: |
          mkdir -p QA/release
          set -o pipefail
          python3 scripts/hosted_linux_pipeline.py release --revision "$GITHUB_SHA" 2>&1 | tee QA/release/pages-release.log
          python3 scripts/pipeline.py verify-public --revision "$GITHUB_SHA" 2>&1 | tee QA/release/pages-verify-public.log

      - name: Upload candidate qualification evidence
        if: always()
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-qualification-${{ github.sha }}
          if-no-files-found: warn
          path: |
            QA/release/*.json
            QA/release/*.log
            QA/map_first/**/*.json
            QA/map_first/screenshots/**
            QA/photo_integrity.json
            QA/route_panel/**/*.json
            QA/project_os_verify/ui_revamp_r4/**
            .public-site/.release-provenance.json
            release-path-checkout/QA/release/*.json
            release-path-checkout/QA/release/*.log
            release-path-checkout/QA/map_first/**/*.json
            release-path-checkout/QA/map_first/screenshots/**
            release-path-checkout/QA/project_os_verify/ui_revamp_r4/**
            release-path-checkout/.public-site/.release-provenance.json
