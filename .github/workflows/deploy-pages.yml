name: Deploy current main to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out main, including the local Smart Map archive
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Assemble the validated public runtime
        run: python3 scripts/prepare_public_site.py .public-site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .public-site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

