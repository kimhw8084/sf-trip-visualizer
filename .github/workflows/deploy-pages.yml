name: Deploy current main to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact triggering revision
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: true

      - name: Set up the qualification runtime
        # actions/setup-python v5.6.0
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install the repository QA dependencies
        run: |
          python3 -m pip install --require-hashes -r requirements-qa.txt
          python3 -m playwright install --with-deps chromium firefox webkit

      - name: Run exact-revision qualification and assemble Pages
        run: python3 scripts/pipeline.py release --revision "$GITHUB_SHA"

      - name: Verify uploaded artifact provenance before upload
        run: python3 scripts/pipeline.py verify-public --revision "$GITHUB_SHA"

      - name: Upload Pages artifact
        # actions/upload-pages-artifact v5.0.0
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: .public-site

      - name: Deploy
        id: deployment
        # actions/deploy-pages v5.0.1
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
